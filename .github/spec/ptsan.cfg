# CPU2017 rate configuration shared by correctness and performance jobs.
# C/C++ workloads plus mixed-language 507.cactuBSSN_r for glibc only.
# PTSan.cmake dependency stacks; generic x86-64 ISA. Baselines opt out of PTSan.
%ifndef %{baseline}
%define baseline 0
%endif
%ifndef %{stack_temporal}
%define stack_temporal 1
%endif
%ifndef %{id32}
%define id32 0
%endif
command_add_redirect = 1
ignore_errors = 1
# Correctness CI: override specinvoke's built-in -q, preserving error statuses.
enable_monitor = 1
iterations = 1
label = ci-%{mode}
# Non-reportable CI: system Make supports the coordinator's shared jobserver.
# An explicit -j here would replace the shared limit with one per benchmark.
make = /usr/bin/make
makeflags =
output_format = txt,csv
reportable = 0
tune = base
copies = 1
threads = 1
sysinfo_program =

default:
   monitor_specrun_wrapper = $command -k
   CC = %{compiler_dir}/clang %{c_config} -m64 -std=c99
   CXX = %{compiler_dir}/clang++ %{cxx_config} -m64 -std=c++03
   CC_VERSION_OPTION = -v
   CXX_VERSION_OPTION = -v
   EXTRA_PORTABILITY = -DSPEC_LP64

default=base:
   OPTIMIZE = -O3 -g -fno-unsafe-math-optimizations -fcommon
   # CI selects 0 for ID32 and the glibc paper-style performance job; otherwise 1.
   # Representation is selected by the driver configs, including ID32.
   # One build serves test and ref inputs; internal runtime validation is disabled.
   # Preserve IDs in arithmetic/comparisons, matching the established SPEC recipes.
%if !%{baseline}
   COPTIMIZE = -mllvm -ptsan-reoptimize -mllvm -ptsan-stack-temporal-safety=%{stack_temporal} -mllvm -ptsan-clear-ids-on-arith=0 -mllvm -ptsan-clear-ids-on-cmp=0 -mllvm -ptsan-abort-on-error
   CXXOPTIMIZE = -mllvm -ptsan-reoptimize -mllvm -ptsan-stack-temporal-safety=%{stack_temporal} -mllvm -ptsan-clear-ids-on-arith=0 -mllvm -ptsan-clear-ids-on-cmp=0 -mllvm -ptsan-abort-on-error
%endif

intrate=base:
   EXTRA_COPTIMIZE = -fno-strict-aliasing -fgnu89-inline

500.perlbench_r:
   PORTABILITY = -DSPEC_LINUX_X64
%if %{musl}
   PORTABILITY += -DI_FCNTL -DSPEC_NO_USE_STDIO_PTR -DSPEC_NO_USE_STDIO_BASE
%endif
%if !%{musl}
# Cactus builds Fortran support sources; the selected benchmark paths use C/C++.
# Keep Fortran uninstrumented, matching the paper's GNU Fortran recipe.
507.cactuBSSN_r:
   FC = /usr/bin/gfortran -m64
   FC_VERSION_OPTION = -v
   FPORTABILITY = -fallow-argument-mismatch
%endif
520.omnetpp_r:
   CXXPORTABILITY = -D_LARGEFILE64_SOURCE
523.xalancbmk_r:
   PORTABILITY = -DSPEC_LINUX -fdelayed-template-parsing
%if %{musl}
   PORTABILITY += -DSPEC_MACOSX_GCC
525.x264_r:
   CPORTABILITY = -DELIDE_CODE
%endif
526.blender_r:
   PORTABILITY = -funsigned-char -DSPEC_LINUX
   CXXPORTABILITY = -D__BOOL_DEFINED
%if %{musl}
   CPORTABILITY = -I%{compat_dir}
   CXXPORTABILITY += -I%{compat_dir}
%endif

%if !%{baseline} && !%{strict}
# GCC reads hard_regno_nregs[-1] before checking r < 0 in count_spilled_pseudo.
# Keep this exception in non-strict modes only; strict requires tagged globals.
502.gcc_r=base:
   COPTIMIZE += -mllvm -ptsan-instrument-globals=0
%endif

%if %{id32}
# Preserve page-offset bits when GCC inspects numeric addresses.
502.gcc_r=base:
   COPTIMIZE += -mllvm -ptsan-strip-pointer-bit-twiddles=12
# Stack accounting subtracts addresses in different frames.
520.omnetpp_r=base:
   CXXOPTIMIZE += -mllvm -ptsan-clear-ids-on-arith=1
%endif
